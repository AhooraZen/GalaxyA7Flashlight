name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs (Debug & Release)
        run: ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyA7Flashlight-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyA7Flashlight-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.2.0 --yes 2>/dev/null || true
          git tag -d v1.2.0 2>/dev/null || true
          git push origin :refs/tags/v1.2.0 2>/dev/null || true
          gh release create v1.2.0 \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Galaxy A7 Flashlight v1.2.0" \
            --notes "v1.2.0: Direct Samsung S2MU005 PMIC kernel driver control for Front (leds-sec2) and Rear (leds-sec1) LEDs with full 100% brightness and instantaneous zero-lag response."
