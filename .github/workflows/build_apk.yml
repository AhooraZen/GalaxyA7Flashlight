name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (arm64-v8a)
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyA7Flashlight-arm64-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.3.0"
          fi
          gh release create "$TAG_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            --title "Galaxy A7 Flashlight $TAG_NAME (arm64-v8a)" \
            --notes "Galaxy A7 Flashlight release $TAG_NAME: Optimized arm64-v8a release build with direct S2MU005 PMIC hardware brightness control and zero-lag libsu root access." || \
          gh release upload "$TAG_NAME" app/build/outputs/apk/release/app-release.apk --clobber
