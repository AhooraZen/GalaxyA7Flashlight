name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (arm64-v8a)
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyA7Flashlight-arm64-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.3.0 --yes 2>/dev/null || true
          git tag -d v1.3.0 2>/dev/null || true
          git push origin :refs/tags/v1.3.0 2>/dev/null || true
          gh release create v1.3.0 \
            app/build/outputs/apk/release/app-release.apk \
            --title "Galaxy A7 Flashlight v1.3.0 (arm64-v8a)" \
            --notes "v1.3.0: Optimized arm64-v8a release build with direct S2MU005 PMIC hardware brightness control (0..15 for Front Selfie, 0..31 for Rear Flash) and zero-lag libsu integration."
